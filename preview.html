<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>Markdown 預覽</title>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font: 15px/1.7 "Segoe UI", "Microsoft JhengHei", system-ui, sans-serif;
    color: #1f2328;
    background: #fff;
  }
  #bar {
    position: fixed; top: 0; left: 0; right: 0; z-index: 10;
    display: flex; align-items: center; gap: 12px;
    padding: 10px 18px;
    background: #f6f8fa; border-bottom: 1px solid #d8dee4;
    box-shadow: 0 1px 3px rgba(0,0,0,.06);
  }
  #bar .title { font-weight: 600; }
  #bar .hint { color: #57606a; font-size: 13px; }
  #bar .spacer { margin-left: auto; }
  #bar button {
    padding: 7px 16px; font-size: 14px; font-family: inherit;
    border: 1px solid #d0d7de; border-radius: 6px; cursor: pointer;
    background: #fff; color: #1f2328;
  }
  #bar button:hover { background: #f3f4f6; }
  #bar button.primary { background: #2563eb; border-color: #2563eb; color: #fff; }
  #bar button.primary:hover { background: #1d4ed8; }
  #bar .opt {
    display: flex; align-items: center; gap: 5px;
    font-size: 13px; color: #57606a; cursor: pointer; user-select: none;
  }
  #bar .opt input { margin: 0; cursor: pointer; }
  #doc { max-width: 860px; margin: 0 auto; padding: 84px 24px 80px; }
  #doc h1, #doc h2 { border-bottom: 1px solid #d8dee4; padding-bottom: .3em; }
  #doc h1 { font-size: 1.9em; margin: .8em 0 .5em; }
  #doc h2 { font-size: 1.5em; margin: 1.4em 0 .5em; }
  #doc h3 { font-size: 1.2em; margin: 1.2em 0 .5em; }
  #doc img { max-width: 100%; height: auto; }
  #doc table { border-collapse: collapse; display: block; overflow-x: auto; max-width: 100%; margin: 1em 0; }
  #doc th, #doc td { border: 1px solid #d0d7de; padding: 6px 13px; }
  #doc th { background: #f6f8fa; }
  #doc tr:nth-child(2n) { background: #fbfcfd; }
  #doc code {
    font: 85%/1.5 "Cascadia Mono", Consolas, monospace;
    background: #eff1f3; padding: .2em .4em; border-radius: 4px;
  }
  #doc pre { background: #eff1f3; padding: 14px; border-radius: 6px; overflow: auto; }
  #doc pre code { background: none; padding: 0; font-size: 13px; }
  #doc blockquote {
    margin: 1em 0; padding: 0 1em; color: #57606a;
    border-left: 4px solid #d0d7de;
  }
  #doc a { color: #0969da; }
  #doc hr { border: 0; border-top: 1px solid #d8dee4; margin: 1.6em 0; }
  #doc .meta { color: #57606a; font-size: 13px; border-left: 3px solid #d0d7de; padding-left: 12px; }

  @page { margin: 14mm 12mm; }
  @media print {
    #bar { display: none !important; }
    body { background: #fff; }
    #doc { padding: 0; max-width: none; }
    #doc a { color: inherit; text-decoration: none; }
    #doc pre, #doc table, #doc img, #doc blockquote { break-inside: avoid; }
    #doc h1, #doc h2, #doc h3 { break-after: avoid; }
  }
</style>
</head>
<body>
  <div id="bar">
    <span class="title">Markdown 預覽</span>
    <span class="hint" id="hint">正在準備…</span>
    <span class="spacer"></span>
    <label class="opt" title="圖片會變成一大串文字塞進檔案，給 AI 讀時通常不需要">
      <input type="checkbox" id="withImages"> 含圖片
    </label>
    <button id="save">儲存 .md</button>
    <button id="pdf" class="primary">列印 / 另存 PDF</button>
  </div>
  <div id="doc"></div>

  <script src="vendor/marked.min.js"></script>
  <script src="store.js"></script>
  <script src="preview.js"></script>
</body>
</html>
